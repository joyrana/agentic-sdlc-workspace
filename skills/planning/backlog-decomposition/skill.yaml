id: backlog-decomposition
version: 1.0.0
name: Backlog decomposition
description: >-
  Turn approved requirements into one epic, features and independently testable stories, each
  linked to the requirements and acceptance criteria it delivers, with explicit dependencies.
category: planning
triggers:
  intents: [plan_backlog]
  workflow_stages: [plan_backlog]
agents: [planner]
required_context: [requirements_snapshot]
postconditions: [covers_all_requirements, acyclic_dependencies]
tools: []
strategies: [llm, heuristic]
model:
  task: planning
  capabilities: [structured_output]
  expected_output_tokens: 4000
budgets: { max_input_tokens: 20000, max_output_tokens: 6000, max_model_calls: 3 }
timeout_s: 120
retry: { max_attempts: 3, backoff_s: 0.5 }
approval_level: human_review
evaluation:
  suite: planning
  success_criteria: { requirement_coverage: 1.0, acyclic: 1.0 }
implementation: agentic_sdlc.skills_impl.planning:BacklogDecomposition
provenance: { owner: platform, created: "2026-10-10" }
input_schema:
  type: object
  additionalProperties: false
  required: [project_name, epic_title, requirements]
  properties:
    project_name: { type: string }
    epic_title: { type: string }
    requirements:
      type: array
      minItems: 1
      items:
        type: object
        required: [key, kind, title, statement, priority, criteria]
        properties:
          key: { type: string }
          kind: { type: string }
          title: { type: string }
          statement: { type: string }
          priority: { type: string }
          origin: { type: string }
          criteria:
            type: array
            items:
              type: object
              required: [key, text]
              properties:
                key: { type: string }
                text: { type: string }
                origin: { type: string }
output_schema:
  type: object
  additionalProperties: false
  required: [epic, features, stories, dependencies]
  properties:
    epic:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        labels: { type: array, items: { type: string } }
    features:
      type: array
      minItems: 1
      items:
        type: object
        required: [ref, title, description]
        properties:
          ref: { type: string }
          title: { type: string, minLength: 1 }
          description: { type: string }
    stories:
      type: array
      minItems: 1
      items:
        type: object
        required: [ref, kind, title, description, feature_ref, requirement_keys, criteria_keys, priority, labels]
        properties:
          ref: { type: string }
          kind: { enum: [story, task, enhancement] }
          title: { type: string, minLength: 1, maxLength: 300 }
          description: { type: string }
          feature_ref: { type: string }
          requirement_keys: { type: array, minItems: 1, items: { type: string } }
          criteria_keys: { type: array, items: { type: string } }
          priority: { type: integer, minimum: 1, maximum: 5 }
          labels: { type: array, items: { type: string } }
    dependencies:
      type: array
      items:
        type: object
        required: [from_ref, to_ref, reason]
        properties:
          from_ref: { type: string }
          to_ref: { type: string }
          reason: { type: string }
