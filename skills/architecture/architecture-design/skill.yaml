id: architecture-design
version: 1.0.0
name: Architecture design
description: >-
  Propose design options with trade-offs for requirements in a repository, recommend one, and trace
  every requirement to a component. Output is reviewed and approved by a human before any code changes.
category: architecture
triggers:
  intents: [design]
  workflow_stages: [propose_architecture]
agents: [architect]
required_context: [requirements_snapshot, repository_summary]
postconditions: [traces_all_requirements]
tools: []
strategies: [llm, heuristic]
model:
  task: architecture
  capabilities: [structured_output]
  expected_output_tokens: 4000
budgets: { max_input_tokens: 24000, max_output_tokens: 6000, max_model_calls: 3 }
timeout_s: 180
retry: { max_attempts: 3, backoff_s: 0.5 }
approval_level: human_approval
implementation: agentic_sdlc.skills_impl.architecture:ArchitectureDesign
provenance: { owner: platform, created: "2026-10-10" }
input_schema:
  type: object
  additionalProperties: false
  required: [scope_title, repository, requirements]
  properties:
    scope_title: { type: string }
    repository: { type: object, required: [commit, modules, file_count, languages, frameworks, conventions] }
    requirements:
      type: array
      minItems: 1
      items: { type: object, required: [key, kind, title, statement] }
    review_feedback: { type: array, items: { type: string } }
output_schema:
  type: object
  required: [title, context, options, recommended_option, decision_rationale, components, api_contracts,
             failure_modes, security, testing_strategy, deployment, open_risks, diagram_mermaid, traceability]
  properties:
    title: { type: string, minLength: 1 }
    context: { type: string }
    options:
      type: array
      minItems: 1
      items:
        type: object
        required: [name, summary, pros, cons, risks, files]
        properties:
          name: { type: string, minLength: 1 }
          summary: { type: string }
          pros: { type: array, items: { type: string } }
          cons: { type: array, items: { type: string } }
          risks: { type: array, items: { type: string } }
          files: { type: array, items: { type: string } }
    recommended_option: { type: string }
    decision_rationale: { type: string }
    components: { type: array, items: { type: object, required: [name, file, change] } }
    data_model_changes: { type: array, items: { type: string } }
    api_contracts: { type: array, items: { type: object } }
    failure_modes: { type: array, items: { type: string } }
    security: { type: array, items: { type: string } }
    testing_strategy: { type: array, items: { type: string } }
    deployment: { type: array, items: { type: string } }
    open_risks: { type: array, items: { type: string } }
    diagram_mermaid: { type: string, pattern: "^(flowchart|graph|sequenceDiagram)" }
    traceability:
      type: array
      items:
        type: object
        required: [requirement_key, component, approach]
    review_feedback: { type: array, items: { type: string } }
